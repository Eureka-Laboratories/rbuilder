root_hash_use_sparse_trie = true
root_hash_compare_sparse_trie = false
log_json = true
log_level = "info,eureka=debug,servo=debug,rbuilder::live_builder::block_output::bid_value_source=debug"
# log_level = "info,rbuilder=debug,debug_borrow=trace,rbuilder::live_builder::block_output::relay_submit=trace"
chain = "mainnet"
reth_datadir = "/data"
cl_node_url = ["http://127.0.0.1:5052"]
jsonrpc_server_port = 8645
jsonrpc_server_ip = "0.0.0.0"
el_node_ipc_path = "/data/reth.ipc"
# NNG competition feed endpoint (preferred when set)
# scraped_bids_publisher_url = "tcp://0.0.0.0:5555"

enabled_relays = [
    "flashbots",
    "ultrasound-eu",
    "titan",
    "bloxroute_max_profit",
    "bloxroute_regulated",
    "agnostic",
    "aestus",
]
live_builders = ["mp-ordering"]
extra_data = "Eureka (eurekabuilder.xyz)"
ws_toba_port = 3030
coinbase_secret_key = "env:COINBASE_SECRET_KEY"
relay_secret_key = "env:RELAY_SECRET_KEY"
ignore_cancellable_orders = false
simulation_use_random_coinbase = false

# block subsidy disabled in develop
# subsidy = "0.0021447"

loan_signer_secret_key = "env:LOAN_SIGNER_SECRET_KEY"
loan_router_addresses = ["0xd122fcA8E283E7a4311C222D023Da8Df4EA1C0F9"]
coinbase_address = "0xFB74767C1ce1aadA0a0E114441173b57f8C1571b"

#telemetry config
full_telemetry_server_port = 6069
full_telemetry_server_ip = "0.0.0.0"
redacted_telemetry_server_ip = "0.0.0.0"
redacted_telemetry_server_port = 6070

# optimistic builder config
optimistic_enabled = false

[[builders]]
name = "mp-ordering"
algo = "ordering-builder"
discard_txs = true
sorting = "max-profit"
failed_order_retries = 1
drop_failed_orders = true

