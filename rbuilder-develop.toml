# SERVO configuration (parsed by plugin at runtime)
[servo]
enabled = true
ws_url = "wss://relay.servo.auction/ws"
http_url = "https://auctioneer.servo.auction/api/v1/"
el_rpc_url = "http://localhost:8545"
bearer_token = "env:SERVO_BEARER_TOKEN"
servo_secret_key = "env:SERVO_SECRET_KEY"
max_reconnect_attempts = 5
reconnect_delay_ms = 3000
timeout_ms = 10000

[bidding]
max_bid_ratio_bp = 5000 # bid 50% of the total servo value
max_servo_subsidy = "100000000000000" # 0.0001 ETH
