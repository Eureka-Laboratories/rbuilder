log_json = true
log_level = "info"
log_color = false
# Where bid-scraper publishes normalized bids for rbuilder to consume.
# Must match rbuilder's `scraped_bids_publisher_url`.
publisher_url = "tcp://0.0.0.0:5555"

# Ultrasound websocket publishers (EU and US). Enable both for redundancy.
[[publishers]]
type = "ultrasound-ws"
name = "ultrasound-eu"
ultrasound_url = "wss://relay-builders-eu.ultrasound.money/ws/v1/top_bid"
relay_name = "ultrasound-eu"
# Optional headers for ultrasound builder-direct endpoint (leave unset for public WS)
# builder_id = "env:ULTRASOUND_BUILDER_ID"
# api_token = "env:ULTRASOUND_API_TOKEN"

[[publishers]]
type = "ultrasound-ws"
name = "ultrasound-us"
ultrasound_url = "wss://relay-builders-us.ultrasound.money/ws/v1/top_bid"
relay_name = "ultrasound-us"
# Optional headers for ultrasound builder-direct endpoint (leave unset for public WS)
# builder_id = "env:ULTRASOUND_BUILDER_ID"
# api_token = "env:ULTRASOUND_API_TOKEN"

